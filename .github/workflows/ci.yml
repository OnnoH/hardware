name: ci

on:
  push:
  pull_request:

# One run per ref: a push to a pull request branch supersedes the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a new release cannot change the result of the format check.
  CLANG_FORMAT_VERSION: "23.1.3"
  GITLEAKS_VERSION: "8.21.2"

jobs:
  projects:
    name: AC-1 project inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: AC-1 the build matrix covers every platformio.ini
        run: ci/check-project-inventory.sh

      - name: Build the matrix from ci/platformio-projects.txt
        id: list
        run: |
          matrix="$(ci/project-list.sh | jq -R . | jq -sc .)"
          echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"
          echo "${matrix}"

  build:
    name: AC-1 build ${{ matrix.project }}
    needs: projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: AC-1 pio run
        run: pio run -d "${{ matrix.project }}"

  format:
    name: AC-2 clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: AC-2 every C/C++ source matches .clang-format
        run: ci/check-format.sh

  secret-scan:
    name: AC-3 gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still public.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: AC-3 no secrets in the working tree or the history
        run: gitleaks detect --source . --redact --no-banner --verbose

  dependency-audit:
    name: AC-4 dependency inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AC-4 list the declared PlatformIO dependencies
        run: ci/dependency-audit.py
