; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Two sketches under samples/, each in its own environment: both define
; setup() and loop(), so they cannot be compiled into one firmware.
src_dir = samples
include_dir = samples/oled-clock/include

[env]
platform = espressif32
platform_packages =
	platformio/framework-arduinoespressif32@^3.20009.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:oled-clock]
build_src_filter = +<oled-clock/src/>
lib_deps =
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.4.0
	paulstoffregen/Time@^1.6.1

[env:wifi]
build_src_filter = +<wifi/src/>
